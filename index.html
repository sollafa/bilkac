function snd(f,d=.1,type='sine',v=.07,f2){if(!ac||muted)return;try{const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}

 G.hudT-=dt;if(G.hudT<=0){G.hudT=.25;updateHUD()}}
// --- Sorular
let qTimer=null;
function openQuiz(q,cfg){const cat=CATS[q.ci],dd=DIFF[q.d];
 quiz.innerHTML='<div class="qh"><img src="'+icon('cat:'+cat.id,40)+'"><span>'+cat.n+'</span><span class="db" style="background:'+dd.col+'">'+dd.n+'</span></div>'+(cfg.T?'<div id="qt"><i id="qf"></i></div><div id="qs"></div>':'<div class="sec">'+cfg.prog+'</div>')+
  '<p class="qq">'+esc(q.q)+'</p><div id="qo">'+q.o.map((o,i)=>'<button data-i="'+i+'">'+esc(o)+'</button>').join('')+'</div>'+(cfg.stars?'<div class="mb" id="sb"></div>':'');
 quiz.style.display='flex';quiz.scrollTop=0;
 let left=cfg.T||0,tot=cfg.T||0,done=false;const bs=[...quiz.querySelectorAll('#qo button')],sb=$('sb'),qf=$('qf'),qs=$('qs');
 const sbU=()=>{if(sb){sb.innerHTML='<img src="'+icon('star',26)+'" style="width:22px;height:22px;vertical-align:middle"> +10 sn ('+G.stars+')';sb.className='mb'+(G.stars>0?'':' off')}};
 const fin=b=>{if(done)return;done=true;clearInterval(qTimer);const ok=!!b&&q.o[+b.dataset.i]===q.c;bs.forEach(x=>{if(q.o[+x.dataset.i]===q.c)x.style.background='#3ddc84'});if(b&&!ok)b.style.background='#ff5a5a';if(sb)sb.style.display='none';
  if(ok)snd(660,.3,'triangle',.1,990);else snd(180,.3,'sawtooth',.08,90);setTimeout(()=>{quiz.style.display='none';cfg.done(ok)},ok?750:1400)};
 bs.forEach(b=>b.onclick=()=>fin(b));
 if(sb){sbU();sb.onclick=()=>{if(done||G.stars<=0)return;G.stars--;left+=10;tot+=10;sbU();updateHUD();snd(900,.15,'triangle',.08,1300)}}
 if(cfg.T){qs.textContent=Math.ceil(left);qTimer=setInterval(()=>{left-=.1;qf.style.width=Math.max(0,left/tot*100)+'%';qf.style.background=left<4?'#ff4d4d':'var(--ac)';qs.textContent=Math.ceil(Math.max(0,left));if(left<=0)fin(null)},100)}}
function ask(ci){state='quiz';const q=pickQ(ci,diff),base=Math.max(10,20-Math.floor(G.t/30));let T=base;if(diff===3){const L=q.q.length;T=Math.min(25,base+(L>110?5:L>75?3:0))}if(CATS[ci].id==='mat')T=Math.min(25,T+5);
 snd(520,.25,'triangle',.08,1000);
 openQuiz(q,{T,stars:true,done:ok=>{if(ok){G.score+=DIFF[diff].m;G.quizOk++;G.toast={t:1.2,s:'+'+DIFF[diff].m+' puan'}}state='play';updateHUD()}})}
function startGalaxy(){state='galaxy';let n=0;
 quiz.innerHTML='<canvas id="gc" width="160" height="160"></canvas><h2>Galaksi Görevi</h2><p class="note" style="font-size:15px">Süresiz 5 soru. Zorluklar karışık gelir. Hepsini bilirsen <b>1500 altın</b> kazanırsın. Tek yanlış cevapta görev biter.</p>'+mb('gs','Başla','ye');quiz.style.display='flex';
 D.galaxy($('gc').getContext('2d'),80,80,64,.5);$('gs').onclick=next;
 function next(){const ids=selIds(),q=pickQ(ids[rnd(ids.length)],rnd(4));openQuiz(q,{T:0,prog:'Galaksi · Soru '+(n+1)+' / 5',done:ok=>{if(!ok)return end(false);n++;n>=5?end(true):next()}})}
 function end(win){if(win){wallet+=1500;G.galCoins+=1500;LS.set('bk_coins',wallet)}
  quiz.innerHTML='<h2>'+(win?'Galaksi tamamlandı!':'Görev bitti')+'</h2><div class="big">'+(win?'+1500 altın':'😔')+'</div><p class="note">'+(win?'Harika, 5 sorunun hepsini bildin.':'Bir yanlış cevap görevi bitirdi. Oyuna devam!')+'</p>'+mb('gd','Devam','ye');quiz.style.display='flex';snd(win?800:200,.5,win?'triangle':'sawtooth',.1,win?1500:100);
  $('gd').onclick=()=>{quiz.style.display='none';state='play';updateHUD()}}}
function over(){state='menu';view='result';clearInterval(qTimer);quiz.style.display='none';banner.classList.remove('on');setBtns(false);hud.innerHTML='';
 const nr=G.score>best&&G.score>0;if(G.score>best){best=G.score;LS.set('bk_best',best)}LS.set('bk_coins',wallet);submitScore(G.score);
 show('<h2>Oyun bitti!</h2><div class="res">'+DIFF[diff].n+' seviyesi</div><div class="res">✅ '+G.quizOk+' doğru cevap × '+DIFF[diff].m+' puan</div><div class="big">'+G.score+' puan</div><div class="res">'+(nr?'🎉 Yeni rekor!':'Rekor: '+best)+'</div>'+
  '<div class="res">'+coinImg(22)+' '+G.coins+' altın toplandı'+(G.galCoins?' + '+G.galCoins+' galaksi':'')+'</div><div class="res">Cüzdan: <b>'+wallet+'</b></div>'+mb('again','🔁 Tekrar oyna','ye')+mb('home','🏠 Ana ekran'));
 $('again').onclick=start;$('home').onclick=mainMenu;snd(300,.5,'sawtooth',.09,60)}
// ===== Çizim =====
function renderBG(T,dt){const th=THEMES[thIdx%THEMES.length],k=1-Math.exp(-dt*1.4);for(let i=0;i<3;i++){curA[i]+=(th.a[i]-curA[i])*k;curB[i]+=(th.b[i]-curB[i])*k}
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'rgb('+curA.map(Math.round)+')');g.addColorStop(1,'rgb('+curB.map(Math.round)+')');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 const p=th.p;ctx.save();
 for(const q of PT){let x=q.x*W,y=q.y*H;
  if(p==='star'){q.y+=q.v*dt*.5;ctx.fillStyle='rgba(255,255,255,'+(.35+.4*Math.sin(T*2+q.ph))+')';ctx.beginPath();ctx.arc(x,y,q.r,0,7);ctx.fill()}
  else if(p==='ember'){q.y-=q.v*dt*2;q.x+=Math.sin(T+q.ph)*dt*.02;ctx.fillStyle='rgba(255,'+(120+q.ph*20|0)+',40,.7)';ctx.beginPath();ctx.arc(x,y,q.r,0,7);ctx.fill()}
  else if(p==='bubble'){q.y-=q.v*dt*1.6;ctx.strokeStyle='rgba(190,235,255,.5)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(x,y,q.r*2,0,7);ctx.stroke()}
  else if(p==='firefly'){q.x+=Math.sin(T*.8+q.ph)*dt*.03;q.y+=Math.cos(T*.6+q.ph)*dt*.02;ctx.fillStyle='rgba(220,255,120,'+(.4+.5*Math.sin(T*3+q.ph))+')';ctx.beginPath();ctx.arc(x,y,q.r*1.2,0,7);ctx.fill()}
  else if(p==='dust'){q.x+=q.v*dt*.8;ctx.fillStyle='rgba(255,220,160,.35)';ctx.beginPath();ctx.arc(x,y,q.r,0,7);ctx.fill()}
  else{q.y+=q.v*dt*1.4;q.x+=Math.sin(T+q.ph)*dt*.03;ctx.fillStyle='rgba(255,255,255,.8)';ctx.beginPath();ctx.arc(x,y,q.r,0,7);ctx.fill()}
  if(q.y>1.02)q.y=-.02;if(q.y<-.02)q.y=1.02;if(q.x>1.02)q.x=-.02;if(q.x<-.02)q.x=1.02}
 const kd=th.h,amp=H*[.1,.12,.05,.06,.07,.13,0][kd],base=H*.045;if(amp>0){ctx.fillStyle='rgba(0,0,0,.32)';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W+8;x+=8){let h;const s=kd*2.1;if(kd===2)h=(Math.sin(x*.02+T*.8)*.5+.5)*amp;else if(kd===4)h=(Math.sin(x*.008+s)*.5+.5)*amp+Math.sin(x*.02)*3;else if(kd===3)h=Math.abs(Math.sin(x*.045+s))*amp;else h=(Math.abs(Math.sin(x*.011+s))*.65+Math.abs(Math.sin(x*.027+s*2))*.35)*amp;ctx.lineTo(x,H-base-h)}ctx.lineTo(W+8,H);ctx.closePath();ctx.fill()}
 ctx.restore()}
function drawItem(it,T){const t=it.t;
 if(t==='coin'){D.coin(ctx,it.x,it.y,it.r);return}
 if(t==='galaxy'){D.galaxy(ctx,it.x,it.y,it.r,T);return}
 if(t==='haz'){const def=CRE[it.ci],L=it.r*3.4,g=ctx.createLinearGradient(0,it.y-L,0,it.y);g.addColorStop(0,'rgba(255,40,40,0)');g.addColorStop(1,'rgba(255,60,60,.45)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(it.x-it.r*.55,it.y);ctx.lineTo(it.x+it.r*.55,it.y);ctx.lineTo(it.x,it.y-L);ctx.closePath();ctx.fill();
  ctx.save();if(it.ci===5)ctx.globalAlpha=.25+.75*Math.abs(Math.sin(T*1.8+it.ph));def.draw(ctx,it.x,it.y,it.r,T,it);ctx.restore();return}
 const L=it.r*3.2,g=ctx.createLinearGradient(0,it.y-L,0,it.y);g.addColorStop(0,'rgba(60,150,255,0)');g.addColorStop(1,'rgba(100,195,255,.5)');ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(it.x-it.r*.55,it.y);ctx.lineTo(it.x+it.r*.55,it.y);ctx.lineTo(it.x,it.y-L);ctx.closePath();ctx.fill();
 if(t==='cat')D.cat(ctx,CATS[it.ci].id,it.x,it.y,it.r);else D[t](ctx,it.x,it.y,it.r)}
function drawShield(x,y,T,k){const r=36,bl=k<2&&Math.floor(T*8)%2===0;if(bl)return;ctx.save();const g=ctx.createRadialGradient(x,y,r*.55,x,y,r);g.addColorStop(0,'rgba(90,200,255,0)');g.addColorStop(.75,'rgba(90,200,255,.2)');g.addColorStop(1,'rgba(160,238,255,.6)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
 ctx.lineWidth=3.5;ctx.strokeStyle='rgba(200,247,255,'+(.8+.2*Math.sin(T*6))+')';ctx.shadowColor='#5ad0ff';ctx.shadowBlur=16;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();ctx.shadowBlur=0;
 ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,255,255,.6)';for(let i=0;i<3;i++){const a=T*1.6+i*2.1;ctx.beginPath();ctx.arc(x,y,r-4,a,a+.75);ctx.stroke()}
 ctx.fillStyle='rgba(255,255,255,.4)';ctx.beginPath();ctx.ellipse(x-r*.45,y-r*.5,r*.22,r*.1,-.7,0,7);ctx.fill();ctx.restore()}
function drawMagnet(x,y,T){ctx.save();ctx.lineWidth=2;for(let i=0;i<3;i++){const k=((T*.9+i/3)%1);ctx.strokeStyle='rgba(255,90,90,'+(.55*(1-k)).toFixed(2)+')';ctx.beginPath();ctx.arc(x,y,40+k*120,0,7);ctx.stroke()}ctx.restore()}
const TC=['#ffb347','#6cc0ff','#5eead4','#c4a1ff','#ffd23f'];
function render(T,dt){renderBG(T,dt);const live=state==='play'||state==='quiz'||state==='galaxy'||state==='pause';
 if(!live)return;ctx.save();if(G.shake>0)ctx.translate(rr(-3,3),rr(-3,3));
 for(const it of G.items)drawItem(it,T);
 for(const p of G.trail){ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=rocket>=5?'hsl('+(T*220%360)+',90%,60%)':TC[rocket];ctx.beginPath();ctx.arc(p.x,p.y,(rocket>=3?4:3)*p.l+1,0,7);ctx.fill()}ctx.globalAlpha=1;
 if(G.magnet>0)drawMagnet(P.x,P.y,T);
 D.rocket(ctx,P.x,P.y,.95,rocket,T,true);if(G.shield>0)drawShield(P.x,P.y,T,G.shield);
 ctx.restore();
 if(G.flash>0){ctx.fillStyle='rgba(255,0,0,'+(G.flash*.45).toFixed(2)+')';ctx.fillRect(0,0,W,H)}
 if(G.toast){ctx.save();ctx.globalAlpha=Math.min(1,G.toast.t*2);ctx.textAlign='center';ctx.font='bold 30px "Trebuchet MS",sans-serif';ctx.lineWidth=5;ctx.strokeStyle='rgba(0,0,0,.6)';ctx.strokeText(G.toast.s,W/2,H*.32);ctx.fillStyle='#fff';ctx.fillText(G.toast.s,W/2,H*.32);ctx.restore()}}
let lastT=0;
function loop(ts){requestAnimationFrame(loop);const dt=Math.min((ts-lastT)/1000||0,.05);lastT=ts;if(state==='play')update(dt);render(ts/1000,dt)}
mainMenu();requestAnimationFrame(loop);

</script>
